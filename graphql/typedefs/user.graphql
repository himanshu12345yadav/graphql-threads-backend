input UserInput {
  firstName: String!
  lastName: String!
  email: String!
  password: String!
}

type User {
  id: String!
  email: String!
}

type Query {
  users: [User]!
  getUserToken(email: String!, password: String!): String
}

type Mutation {
  createUser(user: UserInput!): String
  updateUser(user: UserInput!): User!
}
